name: asr-benchmark-pipe
channels:
  - conda-forge
  - nodefaults
dependencies:
  # core interpreter
  - python==3.12
  - pip
  - python-dotenv
  - ipykernel

  # Base audio and math librairies
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - joblib
  - py-xgboost
  - librosa
  - ffmpeg
  - jupyter
  - jupyterlab

  # Machine Learning and Apple Silicon Specifics
  - pip:
      - mlflow>=2.15.0
      - mlx
      - mlx-whisper
      - torch==2.14.1
      - torchaudio==2.11.0
      - torchcodec==0.17.0
      - transformers
      - datasets
      - jiwer
      - gradio
      - modal
      - google-cloud-storage

